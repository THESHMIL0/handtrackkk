<!DOCTYPE html>
<html lang="en" class="h-full bg-black text-white select-none overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AR Spatial Vision Suite</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- MediaPipe Hands & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    .glass-panel {
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.85);
    }
    
    .glass-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
    }

    .glass-btn:hover, .glass-btn:active {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .glass-btn.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
    }

    .glow-text {
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }

    /* Mobile Safe Area */
    .pb-safe {
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
    }

    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-full w-full bg-black text-white relative font-mono overflow-hidden">

  <!-- Live Video Feed (Hidden processing source) -->
  <video id="webcam" class="opacity-0 pointer-events-none absolute w-full h-full object-cover" playsinline webkit-playsinline></video>

  <!-- AR Render Canvas -->
  <canvas id="arCanvas" onclick="handleCanvasClick()" class="w-full h-full absolute inset-0 object-cover cursor-pointer"></canvas>

  <!-- TOGGLEABLE UI CONTAINER -->
  <div id="uiContainer" class="transition-opacity duration-300">
    <!-- TOP HUD OVERLAY -->
    <div class="absolute top-3 left-3 right-3 sm:top-4 sm:left-4 sm:right-4 flex justify-between items-start pointer-events-none z-20">
      <!-- Diagnostics Readout -->
      <div class="glass-panel rounded-xl p-2.5 sm:p-3 flex flex-col gap-1 min-w-[150px] sm:min-w-[180px]">
        <div class="flex items-center justify-between text-[10px] sm:text-xs tracking-wider border-b border-white/10 pb-1">
          <span class="text-neutral-400">FPS</span>
          <span id="hudFps" class="font-bold text-white glow-text">--</span>
        </div>
        <div class="flex items-center justify-between text-[10px] sm:text-xs tracking-wider">
          <span class="text-neutral-400">HANDS</span>
          <span id="hudHandCount" class="font-bold text-white">0</span>
        </div>
        <div class="flex items-center justify-between text-[10px] sm:text-xs tracking-wider">
          <span class="text-neutral-400">STATE</span>
          <span id="hudGesture" class="font-bold text-neutral-300 truncate max-w-[90px] sm:max-w-none">SEARCHING...</span>
        </div>
      </div>

      <!-- Black Hole HUD -->
      <div id="blackHoleHud" class="glass-panel rounded-xl p-2.5 sm:p-3 flex-col gap-1 min-w-[170px] sm:min-w-[210px] hidden">
        <div class="text-[9px] sm:text-[10px] tracking-widest text-neutral-400 uppercase border-b border-white/10 pb-1 font-semibold flex justify-between items-center">
          <span>SINGULARITY METRICS</span>
          <span class="w-2 h-2 rounded-full bg-white animate-ping"></span>
        </div>
        <div class="flex items-center justify-between text-[10px] sm:text-xs">
          <span class="text-neutral-400">MASS (M<sub>☉</sub>)</span>
          <span id="bhMass" class="font-bold text-white">1.00 × 10⁶</span>
        </div>
        <div class="flex items-center justify-between text-[10px] sm:text-xs">
          <span class="text-neutral-400">SCHWARZSCHILD</span>
          <span id="bhRadius" class="font-bold text-white">120 px</span>
        </div>
        <div class="flex items-center justify-between text-[10px] sm:text-xs">
          <span class="text-neutral-400">KERR SPIN</span>
          <span id="bhSpin" class="font-bold text-white">0.92</span>
        </div>
      </div>
    </div>

    <!-- PINCH / SHOCKWAVE NOTIFICATION BADGE -->
    <div id="pinchBadge" class="absolute top-16 sm:top-20 left-1/2 -translate-x-1/2 glass-panel px-3 py-1 sm:px-4 sm:py-1.5 rounded-full text-[10px] sm:text-xs tracking-widest uppercase opacity-0 transition-opacity duration-300 pointer-events-none z-30 font-semibold text-white border border-white/30 text-center whitespace-nowrap">
      GRAVITATIONAL WAVE DISCHARGED
    </div>

    <!-- BOTTOM CONTROL DOCK (ICON ONLY + CAMERA TOGGLE) -->
    <div class="absolute bottom-4 sm:bottom-6 left-1/2 -translate-x-1/2 z-30 pb-safe pointer-events-auto">
      <div class="flex items-center gap-2 p-1.5 glass-panel rounded-2xl">
        
        <!-- Laser Web Mode -->
        <button id="btnLaserMode" onclick="setMode('laser')" title="Laser Web Mode" aria-label="Laser Web Mode" class="glass-btn active w-11 h-11 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center shrink-0">
          <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </button>

        <!-- Dimension Box Mode -->
        <button id="btnDimensionMode" onclick="setMode('dimension')" title="Dimension Box Mode" aria-label="Dimension Box Mode" class="glass-btn w-11 h-11 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center shrink-0">
          <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
          </svg>
        </button>

        <!-- Black Hole Mode -->
        <button id="btnBlackHoleMode" onclick="setMode('blackhole')" title="Black Hole Mode" aria-label="Black Hole Mode" class="glass-btn w-11 h-11 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center shrink-0">
          <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke-width="2" stroke-dasharray="4 2"/>
            <circle cx="12" cy="12" r="4" fill="currentColor"/>
          </svg>
        </button>

        <!-- Filter Selector (Dimension Box Mode only) -->
        <div id="filterDropdown" class="hidden border-l border-white/20 pl-2 my-0.5 shrink-0">
          <select id="filterSelect" onchange="changeFilter(this.value)" class="bg-black/90 text-white text-[11px] sm:text-xs rounded-xl border border-white/30 px-2 py-2.5 h-11 sm:h-12 focus:outline-none focus:border-white max-w-[110px] sm:max-w-[140px]">
            <option value="0">👾 Pixel</option>
            <option value="1">🌐 Cyan</option>
            <option value="2">📺 80s VHS</option>
            <option value="3">🎨 Pop-Art</option>
            <option value="4">🎆 Neon</option>
            <option value="5">🔥 Thermal</option>
            <option value="6">⚡ Negative</option>
          </select>
        </div>

        <!-- Vertical Divider -->
        <div class="w-px h-6 bg-white/20 my-auto shrink-0"></div>

        <!-- Camera / Invisible UI Button -->
        <button id="btnToggleUi" onclick="toggleUi(false)" title="Hide UI (Camera View)" aria-label="Hide UI" class="glass-btn w-11 h-11 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center shrink-0">
          <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h3.28a1 1 0 00.948-.684l1.498-4.493A1 1 0 0111.672 1h0.656a1 1 0 01.948.684l1.498 4.493A1 1 0 0015.72 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
            <circle cx="12" cy="13" r="3" stroke-width="2" />
          </svg>
        </button>

      </div>
    </div>

  </div>

  <!-- UNHIDE HINT TOAST -->
  <div id="unhideHint" class="absolute bottom-8 left-1/2 -translate-x-1/2 glass-panel px-4 py-2 rounded-full text-xs text-white/90 pointer-events-none opacity-0 transition-opacity duration-300 z-40 text-center shadow-2xl border border-white/20">
    Tap anywhere on screen to show UI
  </div>

  <script>
    let currentMode = 'laser'; 
    let currentFilterIndex = 0;
    let uiVisible = true;
    
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('arCanvas');
    const ctx = canvasElement.getContext('2d');
    
    const hudFps = document.getElementById('hudFps');
    const hudHandCount = document.getElementById('hudHandCount');
    const hudGesture = document.getElementById('hudGesture');
    const pinchBadge = document.getElementById('pinchBadge');
    const blackHoleHud = document.getElementById('blackHoleHud');
    const filterDropdown = document.getElementById('filterDropdown');
    const uiContainer = document.getElementById('uiContainer');
    const unhideHint = document.getElementById('unhideHint');

    let isProcessingFrame = false;
    let handResults = null;
    let lastTime = performance.now();
    let frameCount = 0;
    let fps = 0;
    let pinchCooldown = false;

    // --- RELATIVISTIC BLACK HOLE ENGINE VARIABLES ---
    const NUM_BH_PARTICLES = 180; // Optimized particle count for high FPS
    let bhParticles = [];
    let bhPos = { x: 0, y: 0 };
    let bhRadius = 110;
    let bhTargetPos = { x: 0, y: 0 };
    let shockwaves = [];
    let handVelocity = 0;
    let lastHandPos = { x: 0, y: 0 };

    window.addEventListener('load', () => {
      setupCanvasSize();
      initBlackHoleParticles();
      initCameraAndMediaPipe();
    });

    window.addEventListener('resize', setupCanvasSize);

    function setupCanvasSize() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
      if (!bhPos.x && !bhPos.y) {
        bhPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        bhTargetPos = { ...bhPos };
      }
    }

    // --- CAMERA & MEDIAPIPE (OPTIMIZED FOR HIGH FPS) ---
    async function initCameraAndMediaPipe() {
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      // KEY FPS BOOST: modelComplexity: 0 (Lite model tuned for high FPS real-time tracking)
      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 0, 
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      hands.onResults(onHandResults);

      try {
        // Optimized capture resolution for high frame rates
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 640 },
            height: { ideal: 480 },
            facingMode: 'user'
          },
          audio: false
        });
        
        videoElement.srcObject = stream;
        await videoElement.play();

        const processVideoFrame = async () => {
          if (!isProcessingFrame && videoElement.readyState >= 2) {
            isProcessingFrame = true;
            await hands.send({ image: videoElement });
            isProcessingFrame = false;
          }
          requestAnimationFrame(processVideoFrame);
        };

        requestAnimationFrame(processVideoFrame);
      } catch (err) {
        console.error('Camera Access Error:', err);
        showPinchBadge("CAMERA ACCESS DENIED");
      }
    }

    function onHandResults(results) {
      handResults = results;
      updateFpsCounter();

      ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      renderBaseVideoFrame();

      const numHands = handResults.multiHandLandmarks ? handResults.multiHandLandmarks.length : 0;
      hudHandCount.textContent = numHands;

      checkPinchGesture(handResults);

      if (currentMode === 'laser') {
        renderLaserMode(handResults);
      } else if (currentMode === 'dimension') {
        renderDimensionBoxMode(handResults);
      } else if (currentMode === 'blackhole') {
        renderBlackHoleMode(handResults);
      }

      if (currentMode !== 'blackhole' && numHands > 0) {
        drawHandSkeletons(handResults);
      }
    }

    function renderBaseVideoFrame() {
      if (videoElement.videoWidth === 0 || videoElement.videoHeight === 0) return;

      const vWidth = videoElement.videoWidth;
      const vHeight = videoElement.videoHeight;
      const cWidth = canvasElement.width;
      const cHeight = canvasElement.height;

      const vAspect = vWidth / vHeight;
      const cAspect = cWidth / cHeight;

      let drawW, drawH, offsetX, offsetY;

      if (cAspect > vAspect) {
        drawW = cWidth;
        drawH = cWidth / vAspect;
        offsetX = 0;
        offsetY = (cHeight - drawH) / 2;
      } else {
        drawH = cHeight;
        drawW = cHeight * vAspect;
        offsetX = (cWidth - drawW) / 2;
        offsetY = 0;
      }

      ctx.save();
      ctx.translate(cWidth, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(videoElement, 0, 0, vWidth, vHeight, offsetX, offsetY, drawW, drawH);
      ctx.restore();
    }

    function mapLandmarkToScreen(landmark) {
      const vWidth = videoElement.videoWidth || 640;
      const vHeight = videoElement.videoHeight || 480;
      const cWidth = canvasElement.width;
      const cHeight = canvasElement.height;

      const vAspect = vWidth / vHeight;
      const cAspect = cWidth / cHeight;

      let drawW, drawH, offsetX, offsetY;

      if (cAspect > vAspect) {
        drawW = cWidth;
        drawH = cWidth / vAspect;
        offsetX = 0;
        offsetY = (cHeight - drawH) / 2;
      } else {
        drawH = cHeight;
        drawW = cHeight * vAspect;
        offsetX = (cWidth - drawW) / 2;
        offsetY = 0;
      }

      const mirroredX = (1 - landmark.x) * drawW + offsetX;
      const mappedY = landmark.y * drawH + offsetY;

      return { x: mirroredX, y: mappedY };
    }

    // --- 1. LASER WEB MODE (HIGH-PERFORMANCE) ---
    function renderLaserMode(results) {
      hudGesture.textContent = results.multiHandLandmarks?.length ? "LASER ACTIVE" : "SEARCHING...";
      if (!results.multiHandLandmarks) return;

      const keypoints = [];
      results.multiHandLandmarks.forEach((landmarks) => {
        const fingerTips = [4, 8, 12, 16, 20];
        fingerTips.forEach(idx => {
          keypoints.push(mapLandmarkToScreen(landmarks[idx]));
        });
      });

      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.lineWidth = 2;

      for (let i = 0; i < keypoints.length; i++) {
        for (let j = i + 1; j < keypoints.length; j++) {
          const ptA = keypoints[i];
          const ptB = keypoints[j];
          const dist = Math.hypot(ptA.x - ptB.x, ptA.y - ptB.y);

          if (dist < 300) {
            const alpha = 1 - (dist / 300);
            ctx.beginPath();
            ctx.moveTo(ptA.x, ptA.y);
            ctx.lineTo(ptB.x, ptB.y);
            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha.toFixed(2)})`;
            ctx.stroke();
          }
        }
      }

      ctx.fillStyle = '#ffffff';
      keypoints.forEach(pt => {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 4.5, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.restore();
    }

    // --- 2. DIMENSION BOX MODE ---
    function renderDimensionBoxMode(results) {
      hudGesture.textContent = "DIMENSION PORTAL";
      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) return;

      let p1, p2, p3, p4;

      if (results.multiHandLandmarks.length >= 2) {
        const h1 = results.multiHandLandmarks[0];
        const h2 = results.multiHandLandmarks[1];

        p1 = mapLandmarkToScreen(h1[8]);
        p2 = mapLandmarkToScreen(h2[8]);
        p3 = mapLandmarkToScreen(h2[4]);
        p4 = mapLandmarkToScreen(h1[4]);
      } else {
        const h = results.multiHandLandmarks[0];
        p1 = mapLandmarkToScreen(h[8]);
        p2 = mapLandmarkToScreen(h[12]);
        p3 = mapLandmarkToScreen(h[20]);
        p4 = mapLandmarkToScreen(h[4]);
      }

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.lineTo(p4.x, p4.y);
      ctx.closePath();
      
      ctx.clip();
      applyFilterPreset(currentFilterIndex);
      renderBaseVideoFrame();
      ctx.restore();

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.lineTo(p4.x, p4.y);
      ctx.closePath();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      [p1, p2, p3, p4].forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function applyFilterPreset(index) {
      switch (parseInt(index)) {
        case 0: ctx.filter = 'contrast(180%) brightness(120%) grayscale(100%)'; break;
        case 1: ctx.filter = 'invert(100%)'; break;
        case 2: ctx.filter = 'contrast(200%) hue-rotate(90deg) saturate(300%)'; break;
        case 3: ctx.filter = 'saturate(500%) contrast(150%)'; break;
        case 4: ctx.filter = 'invert(85%) hue-rotate(180deg) brightness(130%)'; break;
        case 5: ctx.filter = 'invert(100%) hue-rotate(240deg) saturate(400%)'; break;
        case 6: ctx.filter = 'invert(100%) grayscale(100%)'; break;
        default: ctx.filter = 'none';
      }
    }

    // --- 3. RELATIVISTIC BLACK HOLE ENGINE (OPTIMIZED) ---
    function initBlackHoleParticles() {
      bhParticles = [];
      for (let i = 0; i < NUM_BH_PARTICLES; i++) {
        bhParticles.push({
          angle: Math.random() * Math.PI * 2,
          radiusNorm: 0.8 + Math.random() * 2.5,
          speed: 0.02 + Math.random() * 0.04,
          size: 1 + Math.random() * 2.2,
          zDepth: (Math.random() - 0.5) * 0.4
        });
      }
    }

    function triggerGravitationalWave(x, y) {
      shockwaves.push({
        x: x,
        y: y,
        radius: bhRadius,
        maxRadius: bhRadius * 4.2,
        alpha: 1.0
      });

      showPinchBadge("GRAVITATIONAL WAVE DISCHARGED");
    }

    function renderBlackHoleMode(results) {
      const numHands = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;
      
      if (numHands === 2) {
        const h1 = mapLandmarkToScreen(results.multiHandLandmarks[0][9]);
        const h2 = mapLandmarkToScreen(results.multiHandLandmarks[1][9]);

        bhTargetPos.x = (h1.x + h2.x) / 2;
        bhTargetPos.y = (h1.y + h2.y) / 2;
        
        const dist = Math.hypot(h1.x - h2.x, h1.y - h2.y);
        bhRadius = Math.max(50, Math.min(300, dist / 2));
        hudGesture.textContent = "DUAL HAND SINGULARITY";
      } else if (numHands === 1) {
        const hand = results.multiHandLandmarks[0];
        const wrist = mapLandmarkToScreen(hand[0]);
        const indexTip = mapLandmarkToScreen(hand[8]);
        const thumbTip = mapLandmarkToScreen(hand[4]);

        bhTargetPos.x = wrist.x;
        bhTargetPos.y = wrist.y - 40;

        const pinchDist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
        bhRadius = Math.max(60, Math.min(250, pinchDist * 1.8));
        hudGesture.textContent = "SINGLE HAND KERR CONTROL";
      } else {
        bhTargetPos.x = canvasElement.width / 2;
        bhTargetPos.y = canvasElement.height / 2;
        bhRadius = 110 + Math.sin(Date.now() * 0.002) * 12;
        hudGesture.textContent = "ORBITAL STANDBY";
      }

      const dx = bhTargetPos.x - lastHandPos.x;
      const dy = bhTargetPos.y - lastHandPos.y;
      handVelocity = Math.min(1.0, Math.hypot(dx, dy) / 30);
      lastHandPos = { ...bhTargetPos };

      bhPos.x += (bhTargetPos.x - bhPos.x) * 0.16;
      bhPos.y += (bhTargetPos.y - bhPos.y) * 0.16;

      const massValue = ((bhRadius / 100) ** 3).toFixed(2);
      const spinValue = (0.75 + handVelocity * 0.24).toFixed(2);

      document.getElementById('bhMass').innerHTML = `${massValue} × 10⁶`;
      document.getElementById('bhRadius').textContent = `${Math.round(bhRadius)} px`;
      document.getElementById('bhSpin').textContent = spinValue;

      ctx.save();

      // Shockwaves
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.radius += 10;
        sw.alpha -= 0.03;

        if (sw.alpha <= 0 || sw.radius >= sw.maxRadius) {
          shockwaves.splice(i, 1);
          continue;
        }

        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 255, 255, ${sw.alpha.toFixed(2)})`;
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }

      // Gravitational Lensing Core
      ctx.save();
      ctx.beginPath();
      ctx.arc(bhPos.x, bhPos.y, bhRadius * 2.2, 0, Math.PI * 2);
      ctx.clip();
      renderBaseVideoFrame();
      ctx.restore();

      // Accretion Disk Warped Arcs
      ctx.beginPath();
      ctx.ellipse(bhPos.x, bhPos.y - bhRadius * 0.32, bhRadius * 1.5, bhRadius * 0.8, 0, Math.PI, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 12;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(bhPos.x, bhPos.y + bhRadius * 0.32, bhRadius * 1.5, bhRadius * 0.8, 0, 0, Math.PI);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = 8;
      ctx.stroke();

      // Polar Hawking Jets
      const jetLength = bhRadius * 3.0;
      const jetGlow = ctx.createLinearGradient(bhPos.x, bhPos.y - jetLength, bhPos.x, bhPos.y + jetLength);
      jetGlow.addColorStop(0, 'rgba(255,255,255,0)');
      jetGlow.addColorStop(0.5, 'rgba(255,255,255,0.9)');
      jetGlow.addColorStop(1, 'rgba(255,255,255,0)');

      ctx.beginPath();
      ctx.moveTo(bhPos.x, bhPos.y - jetLength);
      ctx.lineTo(bhPos.x, bhPos.y + jetLength);
      ctx.strokeStyle = jetGlow;
      ctx.lineWidth = 3;
      ctx.stroke();

      // Keplerian Particles
      bhParticles.forEach((p) => {
        const orbitRadius = p.radiusNorm * bhRadius;
        const keplerSpeed = p.speed * Math.sqrt(bhRadius / orbitRadius);
        p.angle += keplerSpeed;

        const px = bhPos.x + Math.cos(p.angle) * orbitRadius;
        const py = bhPos.y + Math.sin(p.angle) * (orbitRadius * 0.3) + (p.zDepth * 12);

        const vX = -Math.sin(p.angle);
        const dopplerFactor = 1 + vX * 0.5; 
        const alpha = Math.min(1.0, Math.max(0.15, p.zDepth > 0 ? dopplerFactor * 0.85 : dopplerFactor * 0.35));

        ctx.beginPath();
        ctx.arc(px, py, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(2)})`;
        ctx.fill();
      });

      // Photon Rings
      ctx.beginPath();
      ctx.arc(bhPos.x, bhPos.y, bhRadius * 1.12, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.lineWidth = 3.5;
      ctx.stroke();

      // Event Horizon Core Shadow
      ctx.beginPath();
      ctx.arc(bhPos.x, bhPos.y, bhRadius, 0, Math.PI * 2);
      ctx.fillStyle = '#000000';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.restore();
    }

    // --- HELPER GESTURES & UI CONTROLS ---
    function checkPinchGesture(results) {
      if (!results.multiHandLandmarks) return;

      for (let landmarks of results.multiHandLandmarks) {
        const indexTip = mapLandmarkToScreen(landmarks[8]);
        const thumbTip = mapLandmarkToScreen(landmarks[4]);
        const dist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);

        if (dist < 26 && !pinchCooldown) {
          pinchCooldown = true;

          if (currentMode === 'dimension') {
            currentFilterIndex = (currentFilterIndex + 1) % 7;
            document.getElementById('filterSelect').value = currentFilterIndex;
            showPinchBadge("FILTER CHANGED");
          } else if (currentMode === 'blackhole') {
            triggerGravitationalWave(indexTip.x, indexTip.y);
          }

          setTimeout(() => { pinchCooldown = false; }, 800);
          break;
        }
      }
    }

    function showPinchBadge(text) {
      if (!uiVisible) return;
      if (text) pinchBadge.textContent = text;
      pinchBadge.classList.remove('opacity-0');
      pinchBadge.classList.add('opacity-100');
      setTimeout(() => {
        pinchBadge.classList.remove('opacity-100');
        pinchBadge.classList.add('opacity-0');
      }, 1200);
    }

    function toggleUi(show) {
      uiVisible = (show !== undefined) ? show : !uiVisible;

      if (uiVisible) {
        uiContainer.classList.remove('opacity-0', 'pointer-events-none');
        unhideHint.classList.remove('opacity-100');
        unhideHint.classList.add('opacity-0');
      } else {
        uiContainer.classList.add('opacity-0', 'pointer-events-none');
        unhideHint.classList.remove('opacity-0');
        unhideHint.classList.add('opacity-100');
        setTimeout(() => {
          unhideHint.classList.remove('opacity-100');
          unhideHint.classList.add('opacity-0');
        }, 2200);
      }
    }

    function handleCanvasClick() {
      if (!uiVisible) {
        toggleUi(true);
      }
    }

    function drawHandSkeletons(results) {
      if (!results.multiHandLandmarks) return;

      const connections = [
        [0,1],[1,2],[2,3],[3,4],
        [0,5],[5,6],[6,7],[7,8],
        [5,9],[9,10],[10,11],[11,12],
        [9,13],[13,14],[14,15],[15,16],
        [13,17],[17,18],[18,19],[19,20],[0,17]
      ];

      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 1.5;
      ctx.fillStyle = '#ffffff';

      results.multiHandLandmarks.forEach(landmarks => {
        const mapped = landmarks.map(mapLandmarkToScreen);

        ctx.beginPath();
        connections.forEach(([i, j]) => {
          ctx.moveTo(mapped[i].x, mapped[i].y);
          ctx.lineTo(mapped[j].x, mapped[j].y);
        });
        ctx.stroke();

        mapped.forEach(pt => {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 2, 0, Math.PI * 2);
          ctx.fill();
        });
      });
      ctx.restore();
    }

    function updateFpsCounter() {
      const now = performance.now();
      frameCount++;
      if (now - lastTime >= 1000) {
        fps = Math.round((frameCount * 1000) / (now - lastTime));
        hudFps.textContent = fps;
        frameCount = 0;
        lastTime = now;
      }
    }

    function setMode(mode) {
      currentMode = mode;

      document.getElementById('btnLaserMode').classList.toggle('active', mode === 'laser');
      document.getElementById('btnDimensionMode').classList.toggle('active', mode === 'dimension');
      document.getElementById('btnBlackHoleMode').classList.toggle('active', mode === 'blackhole');

      filterDropdown.classList.toggle('hidden', mode !== 'dimension');
      blackHoleHud.classList.toggle('hidden', mode !== 'blackhole');
      blackHoleHud.classList.toggle('flex', mode === 'blackhole');
    }

    function changeFilter(val) {
      currentFilterIndex = parseInt(val);
      showPinchBadge("FILTER CHANGED");
    }
  </script>
</body>
</html>
