<!DOCTYPE html>
<html lang="en" class="h-full bg-black text-white select-none overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AR Spatial Vision Suite</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- MediaPipe Hands & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    /* Glassmorphism & Cyber Aesthetics */
    .glass-panel {
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.85);
    }
    
    .glass-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
    }

    .glass-btn:hover, .glass-btn:active {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    .glass-btn.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
    }

    .glow-text {
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
    }

    .pb-safe {
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
    }

    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-full w-full bg-black text-white relative font-mono overflow-hidden">

  <!-- Live Video Feed (Hidden processing source) -->
  <video id="webcam" class="opacity-0 pointer-events-none absolute w-full h-full object-cover" playsinline webkit-playsinline autoplay muted></video>

  <!-- AR Render Canvas -->
  <canvas id="arCanvas" class="w-full h-full absolute inset-0 object-cover cursor-pointer"></canvas>

  <!-- Error Banner (Hidden unless camera fails) -->
  <div id="errorBanner" class="hidden absolute top-6 left-1/2 -translate-x-1/2 z-50 glass-panel rounded-2xl p-4 max-w-sm text-center border-red-500/50">
    <div class="text-red-400 font-bold mb-1 text-sm">CAMERA ACCESS FAILED</div>
    <div id="errorMessage" class="text-xs text-neutral-300 leading-relaxed mb-3">Please allow camera access in your browser site permissions and reload.</div>
    <button onclick="location.reload()" class="glass-btn px-4 py-1.5 rounded-lg text-xs font-bold text-white uppercase">Retry</button>
  </div>

  <!-- TOGGLEABLE UI CONTAINER -->
  <div id="uiContainer" class="transition-opacity duration-300">
    
    <!-- TOP HUD OVERLAY -->
    <div class="absolute top-3 left-3 right-3 sm:top-4 sm:left-4 sm:right-4 flex justify-between items-start pointer-events-none z-20">
      <!-- Diagnostics Readout -->
      <div class="glass-panel rounded-xl p-2.5 sm:p-3 flex flex-col gap-1 min-w-[140px] sm:min-w-[170px]">
        <div class="flex items-center justify-between text-[10px] sm:text-xs tracking-wider border-b border-white/10 pb-1">
          <span class="text-neutral-400">FPS</span>
          <span id="hudFps" class="font-bold text-white glow-text">--</span>
        </div>
        <div class="flex items-center justify-between text-[10px] sm:text-xs tracking-wider">
          <span id="hudTrackLabel" class="text-neutral-400">HANDS</span>
          <span id="hudHandCount" class="font-bold text-white">0</span>
        </div>
        <div class="flex items-center justify-between text-[10px] sm:text-xs tracking-wider">
          <span class="text-neutral-400">STATE</span>
          <span id="hudGesture" class="font-bold text-neutral-300 truncate max-w-[90px] sm:max-w-none">INITIALIZING...</span>
        </div>
      </div>

      <!-- Laser Telemetry HUD (Laser Web mode) -->
      <div id="laserHud" class="glass-panel rounded-xl p-2.5 sm:p-3 flex flex-col gap-1 min-w-[150px] sm:min-w-[180px]">
        <div class="text-[9px] sm:text-[10px] tracking-widest text-neutral-400 uppercase border-b border-white/10 pb-1 font-semibold flex justify-between items-center">
          <span>LASER MATRIX</span>
          <span id="laserStatusDot" class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
        </div>
        <div class="flex items-center justify-between text-[10px] sm:text-xs">
          <span class="text-neutral-400">BEAMS</span>
          <span id="hudBeamCount" class="font-bold text-white">0</span>
        </div>
        <div class="flex items-center justify-between text-[10px] sm:text-xs">
          <span class="text-neutral-400">NODES</span>
          <span id="hudNodeCount" class="font-bold text-white">0</span>
        </div>
      </div>

      <!-- Dimension Box HUD -->
      <div id="boxHud" class="glass-panel rounded-xl p-2.5 sm:p-3 flex-col gap-1 min-w-[150px] sm:min-w-[180px] hidden">
        <div class="text-[9px] sm:text-[10px] tracking-widest text-neutral-400 uppercase border-b border-white/10 pb-1 font-semibold flex justify-between items-center">
          <span>WARP BOX</span>
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        </div>
        <div class="flex items-center justify-between text-[10px] sm:text-xs">
          <span class="text-neutral-400">FILTER</span>
          <span id="hudBoxFilter" class="font-bold text-emerald-300 truncate">THERMAL BLUE</span>
        </div>
        <div class="flex items-center justify-between text-[10px] sm:text-xs">
          <span class="text-neutral-400">TRIGGER</span>
          <span class="font-bold text-white">PINCH 👌</span>
        </div>
      </div>

      <!-- Spatial Draw Telemetry HUD -->
      <div id="drawHud" class="glass-panel rounded-xl p-2.5 sm:p-3 flex-col gap-1 min-w-[150px] sm:min-w-[180px] hidden">
        <div class="text-[9px] sm:text-[10px] tracking-widest text-neutral-400 uppercase border-b border-white/10 pb-1 font-semibold flex justify-between items-center">
          <span>SPATIAL DRAW</span>
          <span id="drawStatusDot" class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
        </div>
        <div class="flex items-center justify-between text-[10px] sm:text-xs">
          <span class="text-neutral-400">TOOL</span>
          <span id="hudDrawTool" class="font-bold text-amber-300">FREEHAND</span>
        </div>
        <div class="flex items-center justify-between text-[10px] sm:text-xs">
          <span class="text-neutral-400">STROKES</span>
          <span id="hudStrokeCount" class="font-bold text-white">0</span>
        </div>
      </div>
    </div>

    <!-- BOTTOM CONTROL DOCK -->
    <div class="absolute bottom-4 left-0 right-0 z-30 flex flex-col items-center gap-2 pointer-events-auto pb-safe px-4">
      
      <!-- Spatial Draw Controls (Visible in Draw Mode) -->
      <div id="drawControls" class="hidden flex items-center gap-2 mb-1">
        <!-- Tool Switcher -->
        <button id="btnToolSwitch" onclick="toggleDrawTool()" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 text-amber-300 border-amber-500/30">
          <span id="toolIcon">✏️</span>
          <span id="toolLabel">FREEHAND</span>
        </button>
        <!-- Clear Canvas -->
        <button onclick="clearDrawings()" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-bold text-red-400 border-red-500/30 flex items-center gap-1">
          <span>🗑️</span> CLEAR
        </button>
      </div>

      <!-- Main Dock Bar -->
      <div class="glass-panel rounded-2xl p-1.5 sm:p-2 flex items-center gap-1.5 sm:gap-2 max-w-full overflow-x-auto">
        
        <!-- Mode 1: Laser Web -->
        <button id="btnModeLaser" onclick="setMode('laser')" class="glass-btn active px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1.5 whitespace-nowrap">
          <span>⚡</span>
          <span class="hidden sm:inline">LASER</span> WEB
        </button>

        <!-- Mode 2: Dimension Box -->
        <button id="btnModeBox" onclick="setMode('box')" class="glass-btn px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1.5 whitespace-nowrap">
          <span>📐</span>
          <span class="hidden sm:inline">DIMENSION</span> BOX
        </button>

        <!-- Mode 3: Spatial Draw -->
        <button id="btnModeDraw" onclick="setMode('draw')" class="glass-btn px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1.5 whitespace-nowrap">
          <span>🎨</span>
          <span class="hidden sm:inline">SPATIAL</span> DRAW
        </button>

        <div class="w-px h-6 bg-white/10 mx-0.5"></div>

        <!-- Color Selector -->
        <select id="colorPalette" onchange="changeColorTheme(this.value)" class="glass-btn px-2 sm:px-3 py-2 rounded-xl text-xs font-bold text-white bg-black/50 outline-none border border-white/20 cursor-pointer">
          <option value="cyan" class="bg-black text-cyan-400">Cyan</option>
          <option value="magenta" class="bg-black text-fuchsia-400">Magenta</option>
          <option value="emerald" class="bg-black text-emerald-400">Emerald</option>
          <option value="gold" class="bg-black text-amber-400">Solar Gold</option>
          <option value="white" class="bg-black text-white">Cyber White</option>
        </select>

        <!-- Hide HUD Toggle -->
        <button onclick="toggleHud()" class="glass-btn p-2 rounded-xl text-xs font-bold text-neutral-300" title="Toggle HUD Display">
          👁️
        </button>
      </div>
    </div>
  </div>

  <script>
    // Global Application State
    const state = {
      activeMode: 'laser', // 'laser', 'box', 'draw'
      colorTheme: 'cyan',
      drawTool: 'freehand', // 'freehand', 'line'
      hudVisible: true,
      
      // Box Filter Settings
      boxFilterIndex: 0,
      boxPinchState: false,
      boxFilters: [
        { name: 'THERMAL BLUE', cssFilter: 'invert(100%) hue-rotate(200%) saturate(400%) contrast(180%)' },
        { name: 'CYBER MATRIX', cssFilter: 'hue-rotate(90deg) contrast(160%) brightness(1.2)' },
        { name: 'NIGHT VISION', cssFilter: 'brightness(1.2) contrast(180%) sepia(100%) hue-rotate(70deg) saturate(500%)' },
        { name: 'X-RAY INVERT', cssFilter: 'invert(100%) contrast(150%)' },
        { name: 'SOLAR GLOW', cssFilter: 'contrast(150%) sepia(100%) hue-rotate(320deg) saturate(400%)' },
        { name: 'MONOCHROME', cssFilter: 'grayscale(100%) contrast(200%)' }
      ],

      // Tracking Diagnostics
      fps: 0,
      frameCount: 0,
      lastFpsUpdate: performance.now(),
      handCount: 0,
      gestureState: 'INITIALIZING...',
      
      // Theme Palette RGB Definitions
      themes: {
        cyan:    { main: '#00f3ff', rgb: [0, 243, 255], glow: 'rgba(0,243,255,0.8)' },
        magenta: { main: '#ff0055', rgb: [255, 0, 85],   glow: 'rgba(255,0,85,0.8)' },
        emerald: { main: '#00ff66', rgb: [0, 255, 102], glow: 'rgba(0,255,102,0.8)' },
        gold:    { main: '#ffaa00', rgb: [255, 170, 0], glow: 'rgba(255,170,0,0.8)' },
        white:   { main: '#ffffff', rgb: [255, 255, 255], glow: 'rgba(255,255,255,0.8)' }
      },

      // Drawing Storage
      strokes: [], // Completed paths
      currentStroke: null, // Active freehand line
      activeLinePreview: null, // Rubber-band line start point

      // MediaPipe & Canvas setup
      hands: null,
      video: null,
      canvas: null,
      ctx: null,
      lastResults: null,
      
      // Pre-calculated transform bounds
      viewTransform: { scale: 1, offsetX: 0, offsetY: 0, videoW: 640, videoH: 480 }
    };

    // Fast Landmark-to-Screen Mapping
    function mapLandmarkToScreen(landmark) {
      const { scale, offsetX, offsetY } = state.viewTransform;
      const mirroredX = 1 - landmark.x;
      const x = mirroredX * state.viewTransform.videoW * scale + offsetX;
      const y = landmark.y * state.viewTransform.videoH * scale + offsetY;
      return { x, y, z: landmark.z };
    }

    // Resize & Cached Projection Matrix
    function updateCanvasSize() {
      if (!state.canvas) return;
      state.canvas.width = window.innerWidth;
      state.canvas.height = window.innerHeight;

      if (state.video && state.video.videoWidth) {
        const vw = state.video.videoWidth;
        const vh = state.video.videoHeight;
        const screenW = state.canvas.width;
        const screenH = state.canvas.height;

        const scale = Math.max(screenW / vw, screenH / vh);
        const offsetX = (screenW - vw * scale) / 2;
        const offsetY = (screenH - vh * scale) / 2;

        state.viewTransform = { scale, offsetX, offsetY, videoW: vw, videoH: vh };
      }
    }

    async function initCameraAndMediaPipe() {
      state.canvas = document.getElementById('arCanvas');
      state.ctx = state.canvas.getContext('2d');
      state.video = document.getElementById('webcam');

      window.addEventListener('resize', updateCanvasSize);

      // 1. Request Camera Permission Immediately
      try {
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          });
        } catch (e) {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        }

        state.video.srcObject = stream;
        await state.video.play();
        updateCanvasSize();

        // Start Canvas Render Animation Loop Immediately
        requestAnimationFrame(renderLoop);

      } catch (err) {
        console.error("Camera Access Error:", err);
        const banner = document.getElementById('errorBanner');
        const msg = document.getElementById('errorMessage');
        banner.classList.remove('hidden');
        msg.innerText = "Camera access was denied or unhandled. Please grant camera permission in your site settings.";
        return;
      }

      // 2. Initialize MediaPipe Hands
      try {
        state.hands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        state.hands.setOptions({
          maxNumHands: 2,
          modelComplexity: 1,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });

        state.hands.onResults(onHandResults);

        // Low-latency WASM tracking buffer
        const processCanvas = document.createElement('canvas');
        processCanvas.width = 360;
        processCanvas.height = 270;
        const processCtx = processCanvas.getContext('2d');

        const processFrame = async () => {
          if (state.video && state.video.readyState >= 2) {
            processCtx.drawImage(state.video, 0, 0, 360, 270);
            await state.hands.send({ image: processCanvas });
          }
          requestAnimationFrame(processFrame);
        };
        requestAnimationFrame(processFrame);

      } catch (err) {
        console.error("MediaPipe Init Error:", err);
      }
    }

    // MediaPipe Hand Results Callback
    function onHandResults(results) {
      state.lastResults = results;
      state.handCount = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;
      
      document.getElementById('hudHandCount').innerText = state.handCount;
      if (state.handCount === 0) {
        state.gestureState = 'SEARCHING...';
      } else if (state.handCount === 1) {
        state.gestureState = 'SINGLE HAND';
      } else {
        state.gestureState = 'DUAL LINKED';
      }
      document.getElementById('hudGesture').innerText = state.gestureState;
    }

    function renderLaserWeb(landmarksList) {
      if (landmarksList.length === 0) return;

      const ctx = state.ctx;
      const theme = state.themes[state.colorTheme];
      let beamCount = 0;
      let nodeCount = 0;

      const fingerTips = [4, 8, 12, 16, 20];
      const handsScreen = landmarksList.map(hand => hand.map(mapLandmarkToScreen));

      ctx.strokeStyle = theme.main;
      ctx.lineWidth = 1.5;
      ctx.shadowColor = theme.glow;
      ctx.shadowBlur = 8;

      // Intra-Hand Perimeter & Palm Spokes
      handsScreen.forEach(hand => {
        ctx.beginPath();
        fingerTips.forEach((tipIdx, i) => {
          const pt = hand[tipIdx];
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
          nodeCount++;
        });
        ctx.closePath();
        ctx.stroke();

        const wrist = hand[0];
        ctx.beginPath();
        fingerTips.forEach(tipIdx => {
          const tip = hand[tipIdx];
          ctx.moveTo(wrist.x, wrist.y);
          ctx.lineTo(tip.x, tip.y);
          beamCount++;
        });
        ctx.stroke();
      });

      // Dual-Hand Parallel Ribbon Beams
      if (handsScreen.length >= 2) {
        const h1 = handsScreen[0];
        const h2 = handsScreen[1];

        ctx.strokeStyle = theme.main;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 12;

        ctx.beginPath();
        fingerTips.forEach(tipIdx => {
          const p1 = h1[tipIdx];
          const p2 = h2[tipIdx];
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          beamCount++;
        });

        for (let i = 0; i < fingerTips.length - 1; i++) {
          const p1 = h1[fingerTips[i]];
          const p2 = h2[fingerTips[i + 1]];
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          beamCount++;
        }
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        fingerTips.forEach(tipIdx => {
          [h1[tipIdx], h2[tipIdx]].forEach(pt => {
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
            ctx.fill();
          });
        });
      }

      ctx.shadowBlur = 0;
      document.getElementById('hudBeamCount').innerText = beamCount;
      document.getElementById('hudNodeCount').innerText = nodeCount;
    }

    function drawHandSkeletonWireframe(ctx, handPts) {
      const connections = [
        [0, 1], [1, 2], [2, 3], [3, 4],     // Thumb
        [0, 5], [5, 6], [6, 7], [7, 8],     // Index
        [0, 9], [9, 10], [10, 11], [11, 12], // Middle
        [0, 13], [13, 14], [14, 15], [15, 16], // Ring
        [0, 17], [17, 18], [18, 19], [19, 20], // Pinky
        [5, 9], [9, 13], [13, 17]           // Palm
      ];

      ctx.save();
      ctx.strokeStyle = 'rgba(255, 200, 150, 0.6)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      connections.forEach(([i, j]) => {
        ctx.moveTo(handPts[i].x, handPts[i].y);
        ctx.lineTo(handPts[j].x, handPts[j].y);
      });
      ctx.stroke();

      ctx.fillStyle = 'rgba(255, 230, 200, 0.8)';
      handPts.forEach(pt => {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 2, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function renderDimensionBox(landmarksList) {
      if (landmarksList.length < 1) return;

      const ctx = state.ctx;
      const theme = state.themes[state.colorTheme];
      const handsScreen = landmarksList.map(hand => hand.map(mapLandmarkToScreen));

      let TL, BL, TR, BR;

      if (handsScreen.length >= 2) {
        // Sort hands by X coordinate so leftHand is screen-left and rightHand is screen-right
        const sortedHands = [...handsScreen].sort((a, b) => a[0].x - b[0].x);
        const leftHand = sortedHands[0];
        const rightHand = sortedHands[1];

        TL = leftHand[8];   // Left Index Tip
        BL = leftHand[4];   // Left Thumb Tip
        TR = rightHand[8];  // Right Index Tip
        BR = rightHand[4];  // Right Thumb Tip

        // Pinch check on left hand for filter switching
        const distPinch = Math.hypot(leftHand[8].x - leftHand[4].x, leftHand[8].y - leftHand[4].y);
        let handPinching = distPinch < 40;

        if (handPinching && !state.boxPinchState) {
          state.boxPinchState = true;
          state.boxFilterIndex = (state.boxFilterIndex + 1) % state.boxFilters.length;
          document.getElementById('hudBoxFilter').innerText = state.boxFilters[state.boxFilterIndex].name;
        } else if (!handPinching) {
          state.boxPinchState = false;
        }
      } else {
        // Single hand fallback frame
        const hand = handsScreen[0];
        const idx = hand[8];
        const thmb = hand[4];

        const distPinch = Math.hypot(idx.x - thmb.x, idx.y - thmb.y);
        let handPinching = distPinch < 40;

        if (handPinching && !state.boxPinchState) {
          state.boxPinchState = true;
          state.boxFilterIndex = (state.boxFilterIndex + 1) % state.boxFilters.length;
          document.getElementById('hudBoxFilter').innerText = state.boxFilters[state.boxFilterIndex].name;
        } else if (!handPinching) {
          state.boxPinchState = false;
        }

        const widthOffset = 300;
        TL = { x: idx.x - widthOffset / 2, y: idx.y };
        BL = { x: thmb.x - widthOffset / 2, y: thmb.y };
        TR = { x: idx.x + widthOffset / 2, y: idx.y };
        BR = { x: thmb.x + widthOffset / 2, y: thmb.y };
      }

      const currentFilter = state.boxFilters[state.boxFilterIndex];

      // 1. Render Filtered Video Feed inside 4-Point Polygon Clip
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(TL.x, TL.y);
      ctx.lineTo(TR.x, TR.y);
      ctx.lineTo(BR.x, BR.y);
      ctx.lineTo(BL.x, BL.y);
      ctx.closePath();
      ctx.clip();

      if (currentFilter.cssFilter) {
        ctx.filter = currentFilter.cssFilter;
      }

      ctx.translate(state.canvas.width, 0);
      ctx.scale(-1, 1);
      const { scale, offsetX, offsetY } = state.viewTransform;
      if (state.video && state.video.videoWidth) {
        ctx.drawImage(state.video, offsetX, offsetY, state.viewTransform.videoW * scale, state.viewTransform.videoH * scale);
      }
      ctx.restore();

      // 2. Render Floating Cyber Pixel Grid Blocks Overlay
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(TL.x, TL.y);
      ctx.lineTo(TR.x, TR.y);
      ctx.lineTo(BR.x, BR.y);
      ctx.lineTo(BL.x, BL.y);
      ctx.closePath();
      ctx.clip();

      const minX = Math.min(TL.x, BL.x);
      const maxX = Math.max(TR.x, BR.x);
      const minY = Math.min(TL.y, TR.y);
      const maxY = Math.max(BL.y, BR.y);
      const w = maxX - minX;
      const h = maxY - minY;

      const time = performance.now() * 0.003;
      const pixelColors = ['#ffffff', '#ff0266', '#00f3ff', '#ffde03'];

      for (let i = 0; i < 55; i++) {
        const px = minX + ((Math.sin(i * 77 + time) * 0.5 + 0.5) * w);
        const py = minY + ((Math.cos(i * 31 + time) * 0.5 + 0.5) * h);
        const sz = (i % 3 === 0) ? 6 : 4;
        ctx.fillStyle = pixelColors[i % pixelColors.length];
        ctx.fillRect(px, py, sz, sz);
      }
      ctx.restore();

      // 3. Render Cyan Boundary Polygon Stroke
      ctx.save();
      ctx.strokeStyle = '#00f3ff';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = 'rgba(0, 243, 255, 0.8)';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(TL.x, TL.y);
      ctx.lineTo(TR.x, TR.y);
      ctx.lineTo(BR.x, BR.y);
      ctx.lineTo(BL.x, BL.y);
      ctx.closePath();
      ctx.stroke();

      // 4. Render Glowing Neon Green Corner Handles
      ctx.fillStyle = '#00ff88';
      ctx.shadowColor = '#00ff88';
      ctx.shadowBlur = 12;
      const handleSize = 16;
      [TL, TR, BR, BL].forEach(pt => {
        ctx.fillRect(pt.x - handleSize / 2, pt.y - handleSize / 2, handleSize, handleSize);
      });
      ctx.restore();

      // 5. Render Thin Skeleton Overlay on both hands
      handsScreen.forEach(handPts => {
        drawHandSkeletonWireframe(ctx, handPts);
      });
    }

    function processSpatialDraw(landmarksList) {
      if (landmarksList.length === 0) return;

      const hand = landmarksList[0].map(mapLandmarkToScreen);
      const indexTip = hand[8];
      const indexPip = hand[6];
      const middleTip = hand[12];
      const ringTip = hand[16];
      const pinkyTip = hand[20];
      const wrist = hand[0];

      const isPointing = (indexTip.y < indexPip.y) && (middleTip.y > wrist.y - 100) && (ringTip.y > wrist.y - 100);
      const isOpenPalm = (indexTip.y < wrist.y) && (middleTip.y < wrist.y) && (ringTip.y < wrist.y) && (pinkyTip.y < wrist.y);

      if (isOpenPalm) {
        const palmCenter = hand[9];
        const eraseRadius = 45;

        state.ctx.strokeStyle = '#ff3344';
        state.ctx.lineWidth = 2;
        state.ctx.beginPath();
        state.ctx.arc(palmCenter.x, palmCenter.y, eraseRadius, 0, Math.PI * 2);
        state.ctx.stroke();

        state.strokes = state.strokes.filter(stroke => {
          return !stroke.points.some(pt => Math.hypot(pt.x - palmCenter.x, pt.y - palmCenter.y) < eraseRadius);
        });

      } else if (isPointing) {
        if (state.drawTool === 'freehand') {
          if (!state.currentStroke) {
            state.currentStroke = { color: state.colorTheme, points: [] };
            state.strokes.push(state.currentStroke);
          }
          state.currentStroke.points.push({ x: indexTip.x, y: indexTip.y });
        } else if (state.drawTool === 'line') {
          if (!state.activeLinePreview) {
            state.activeLinePreview = { startX: indexTip.x, startY: indexTip.y };
          }
          state.activeLinePreview.endX = indexTip.x;
          state.activeLinePreview.endY = indexTip.y;
        }

        state.ctx.fillStyle = state.themes[state.colorTheme].main;
        state.ctx.beginPath();
        state.ctx.arc(indexTip.x, indexTip.y, 6, 0, Math.PI * 2);
        state.ctx.fill();

      } else {
        if (state.activeLinePreview) {
          state.strokes.push({
            color: state.colorTheme,
            points: [
              { x: state.activeLinePreview.startX, y: state.activeLinePreview.startY },
              { x: state.activeLinePreview.endX, y: state.activeLinePreview.endY }
            ]
          });
          state.activeLinePreview = null;
        }
        state.currentStroke = null;
      }
    }

    function renderDrawings() {
      const ctx = state.ctx;

      state.strokes.forEach(stroke => {
        if (stroke.points.length < 2) return;
        const theme = state.themes[stroke.color] || state.themes.cyan;

        ctx.strokeStyle = theme.main;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = theme.glow;
        ctx.shadowBlur = 8;

        ctx.beginPath();
        ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
        for (let i = 1; i < stroke.points.length; i++) {
          ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
        }
        ctx.stroke();
      });

      if (state.activeLinePreview) {
        const theme = state.themes[state.colorTheme];
        ctx.strokeStyle = theme.main;
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(state.activeLinePreview.startX, state.activeLinePreview.startY);
        ctx.lineTo(state.activeLinePreview.endX, state.activeLinePreview.endY);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      ctx.shadowBlur = 0;
      document.getElementById('hudStrokeCount').innerText = state.strokes.length;
    }

    function renderLoop(now) {
      const ctx = state.ctx;
      const canvas = state.canvas;

      state.frameCount++;
      if (now - state.lastFpsUpdate >= 1000) {
        state.fps = state.frameCount;
        state.frameCount = 0;
        state.lastFpsUpdate = now;
        document.getElementById('hudFps').innerText = state.fps;
      }

      // Draw Mirrored Video Feed
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      
      const { scale, offsetX, offsetY } = state.viewTransform;
      if (state.video && state.video.videoWidth) {
        ctx.drawImage(state.video, offsetX, offsetY, state.viewTransform.videoW * scale, state.viewTransform.videoH * scale);
      }
      ctx.restore();

      // Render Active AR Layer
      const landmarksList = state.lastResults && state.lastResults.multiHandLandmarks ? state.lastResults.multiHandLandmarks : [];

      if (state.activeMode === 'laser') {
        renderLaserWeb(landmarksList);
      } else if (state.activeMode === 'box') {
        renderDimensionBox(landmarksList);
      } else if (state.activeMode === 'draw') {
        processSpatialDraw(landmarksList);
      }

      renderDrawings();
      requestAnimationFrame(renderLoop);
    }

    // Controls
    function setMode(mode) {
      state.activeMode = mode;

      document.getElementById('btnModeLaser').classList.toggle('active', mode === 'laser');
      document.getElementById('btnModeBox').classList.toggle('active', mode === 'box');
      document.getElementById('btnModeDraw').classList.toggle('active', mode === 'draw');

      document.getElementById('laserHud').classList.toggle('hidden', mode !== 'laser');
      document.getElementById('boxHud').classList.toggle('hidden', mode !== 'box');
      document.getElementById('drawHud').classList.toggle('hidden', mode !== 'draw');
      document.getElementById('drawControls').classList.toggle('hidden', mode !== 'draw');
    }

    function changeColorTheme(color) {
      state.colorTheme = color;
    }

    function toggleDrawTool() {
      state.drawTool = state.drawTool === 'freehand' ? 'line' : 'freehand';
      document.getElementById('toolLabel').innerText = state.drawTool.toUpperCase();
      document.getElementById('toolIcon').innerText = state.drawTool === 'freehand' ? '✏️' : '📏';
      document.getElementById('hudDrawTool').innerText = state.drawTool.toUpperCase();
    }

    function clearDrawings() {
      state.strokes = [];
      state.activeLinePreview = null;
      state.currentStroke = null;
    }

    function toggleHud() {
      state.hudVisible = !state.hudVisible;
      document.getElementById('uiContainer').style.opacity = state.hudVisible ? '1' : '0';
    }

    // Auto-launch Camera on Load
    window.addEventListener('load', () => {
      initCameraAndMediaPipe();
    });
  </script>
</body>
</html>
