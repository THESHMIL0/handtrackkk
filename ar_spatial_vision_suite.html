<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden bg-black select-none">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Spatial Vision & Black Hole Suite</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MediaPipe Hands & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Space Grotesk', sans-serif;
      touch-action: none;
      background-color: #000000;
    }

    .glass-panel {
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .glass-btn {
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #a3a3a3;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-btn:hover {
      background: rgba(45, 45, 45, 0.95);
      border-color: rgba(255, 255, 255, 0.4);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .glass-btn.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
    }

    .glass-btn.active svg {
      color: #000000 !important;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(10, 10, 10, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.4);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="relative h-full w-full overflow-hidden bg-black text-neutral-100 select-none">

  <!-- CAMERA VIDEO (Hidden DOM video stream feed) -->
  <video id="videoInput" class="absolute inset-0 w-full h-full opacity-0 pointer-events-none" playsinline muted autoplay></video>

  <!-- MAIN BASE VIDEO CANVAS -->
  <canvas id="canvasOutput" class="absolute inset-0 h-full w-full object-cover"></canvas>

  <!-- OVERLAY GRAPHICS CANVAS (Lasers, Dimension Box, Black Hole, HUD) -->
  <canvas id="overlayCanvas" class="absolute inset-0 h-full w-full object-cover pointer-events-none z-10"></canvas>

  <!-- TOP OVERLAY HUD -->
  <div id="topHUD" class="absolute top-0 left-0 right-0 z-20 flex items-start justify-between p-4 pointer-events-none">
    
    <!-- TOP LEFT: TELEMETRY PANELS -->
    <div class="flex items-start gap-3 pointer-events-auto">
      <div id="cyberHud" class="glass-panel px-4 py-2.5 rounded-2xl flex flex-col gap-1 text-xs border-white/20">
        <div class="flex items-center justify-between gap-4 font-mono">
          <span class="text-neutral-400">Hands Detected:</span>
          <span id="hudHandCount" class="font-bold text-white">0</span>
        </div>
        <div class="flex items-center justify-between gap-4 font-mono">
          <span class="text-neutral-400">Gesture:</span>
          <span id="hudGesture" class="font-bold text-neutral-200">Searching...</span>
        </div>
        <div class="flex items-center justify-between gap-4 font-mono">
          <span id="hudParamLabel" class="text-neutral-400">Field Spread:</span>
          <span id="hudSpread" class="font-bold text-white">0%</span>
        </div>
      </div>

      <!-- BLACK HOLE TELEMETRY BLOCK -->
      <div id="blackholeHud" class="hidden glass-panel px-4 py-2.5 rounded-2xl flex flex-col gap-1 text-xs border-white/20 font-mono">
        <div class="flex items-center justify-between gap-4">
          <span class="text-neutral-400">Mass (M☉):</span>
          <span id="bhMass" class="font-bold text-white">4.2 × 10⁶</span>
        </div>
        <div class="flex items-center justify-between gap-4">
          <span class="text-neutral-400">Horizon (Rs):</span>
          <span id="bhRadius" class="font-bold text-white">75 px</span>
        </div>
        <div class="flex items-center justify-between gap-4">
          <span class="text-neutral-400">Deflection:</span>
          <span id="bhDeflect" class="font-bold text-white">18.4°</span>
        </div>
      </div>
    </div>

    <!-- TOP CENTER: PINCH TRIGGER BADGE -->
    <div id="pinchBadge" class="hidden glass-panel px-4 py-2 bg-white text-black rounded-full text-xs font-bold shadow-2xl border border-white flex items-center gap-2 animate-bounce">
      <span class="w-2 h-2 rounded-full bg-black"></span>
      <span id="pinchBadgeText">Action Triggered</span>
    </div>

    <!-- TOP RIGHT: FPS & REEL MODE -->
    <div class="flex items-center gap-2 pointer-events-auto">
      <div class="glass-panel px-3 py-1.5 rounded-xl text-xs font-mono text-neutral-300">
        FPS: <span id="fpsCount">--</span>
      </div>
      <button id="btnReelMode" onclick="toggleReelMode()" class="glass-btn p-2.5 rounded-xl text-neutral-300 hover:text-white" title="Toggle Clean Screen">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- BOTTOM FLOATING CONTROL DOCK -->
  <div id="bottomDock" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex items-center gap-2.5 p-2 rounded-3xl glass-panel shadow-2xl border-neutral-800 pointer-events-auto">
    
    <!-- Mode 1: Laser Web -->
    <button id="btnModeLaser" onclick="setAppMode('laser')" class="glass-btn active p-3 rounded-2xl flex items-center gap-2 text-sm font-semibold" title="Antigravity Laser Web">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
      </svg>
      <span class="hidden sm:inline">Laser Web</span>
    </button>

    <!-- Mode 2: Dimension Box -->
    <button id="btnModeDimension" onclick="setAppMode('dimension')" class="glass-btn p-3 rounded-2xl flex items-center gap-2 text-sm font-semibold" title="Dimension Box Portal">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
      </svg>
      <span class="hidden sm:inline">Dimension Box</span>
    </button>

    <!-- Mode 3: Black Hole Singularity -->
    <button id="btnModeBlackHole" onclick="setAppMode('blackhole')" class="glass-btn p-3 rounded-2xl flex items-center gap-2 text-sm font-semibold" title="Black Hole Singularity">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" stroke-width="2" />
        <path stroke-linecap="round" stroke-dasharray="2 2" stroke-width="1.8" d="M12 2a10 10 0 100 20 10 10 0 000-20z" />
        <path stroke-linecap="round" stroke-width="1.5" d="M12 5a7 7 0 100 14 7 7 0 000-14z" />
      </svg>
      <span class="hidden sm:inline">Black Hole</span>
    </button>

    <div class="h-6 w-px bg-neutral-800 my-auto"></div>

    <!-- Filter Selector Dropdown (Dimension Box Mode) -->
    <div id="filterControl" class="relative hidden">
      <select id="filterSelect" onchange="changeDimensionFilter(this.value)" class="glass-btn px-3 py-2.5 rounded-2xl text-xs font-semibold text-white bg-neutral-900 border border-neutral-700 focus:outline-none cursor-pointer">
        <option value="pixel_grid">Pixel Matrix</option>
        <option value="cyan_edges">Cyan Outlines</option>
        <option value="vhs_glitch">80s VHS Synth</option>
        <option value="pop_art">Pop-Art Comic</option>
        <option value="neon_hologram">Neon Cyberpunk</option>
        <option value="thermal">Thermal Heat</option>
        <option value="negative">Negative Invert</option>
      </select>
    </div>

    <!-- Action: Camera Mirroring Toggle -->
    <button id="btnMirror" onclick="toggleCameraMirror()" class="glass-btn p-3 rounded-2xl text-neutral-300 hover:text-white active" title="Toggle Camera Mirroring">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
      </svg>
    </button>

  </div>

  <script>
    // Global Application State
    let appMode = 'laser'; // 'laser', 'dimension', 'blackhole'
    let isMirrored = true;
    let reelMode = false;
    let dimensionFilter = 'pixel_grid';

    // Hand Tracking State
    let handLandmarksList = [];
    let spreadVal = 0;
    let wasPinching = false;
    let handsReady = true;
    let isProcessingFrame = false;

    // FPS Counter Variables
    let frameCount = 0;
    let lastFpsTime = performance.now();

    // Black Hole Engine Physics Variables
    let bhX = 0, bhY = 0;
    let targetBhX = 0, targetBhY = 0;
    let bhRadius = 70;
    let targetBhRadius = 70;
    let bhSpinAngle = 0;
    let bhParticles = [];
    const MAX_BH_PARTICLES = 220;

    // DOM Canvas & Video References
    const videoElement = document.getElementById('videoInput');
    const canvasOutput = document.getElementById('canvasOutput');
    const ctxOutput = canvasOutput.getContext('2d');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const overlayCtx = overlayCanvas.getContext('2d');

    // Responsive Canvas Resizing
    function resizeCanvases() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvasOutput.width = w;
      canvasOutput.height = h;
      overlayCanvas.width = w;
      overlayCanvas.height = h;
      
      // Initialize Black Hole default center position
      if (bhX === 0 && bhY === 0) {
        bhX = w / 2;
        bhY = h / 2;
        targetBhX = bhX;
        targetBhY = bhY;
      }
    }
    window.addEventListener('resize', resizeCanvases);
    resizeCanvases();

    function initBlackHoleParticles() {
      bhParticles = [];
      for (let i = 0; i < MAX_BH_PARTICLES; i++) {
        bhParticles.push({
          angle: Math.random() * Math.PI * 2,
          distance: 80 + Math.random() * 320,
          speed: 0.01 + Math.random() * 0.03,
          size: 1 + Math.random() * 2.5,
          alpha: 0.3 + Math.random() * 0.7,
          type: Math.random() > 0.85 ? 'polar_jet' : 'accretion'
        });
      }
    }
    initBlackHoleParticles();

    // Computes object-fit: cover parameters so video feeds do not look stretched or warped
    function getCanvasTransform(w, h, vWidth, vHeight) {
      const vAspect = (vWidth && vHeight) ? (vWidth / vHeight) : (16 / 9);
      const cAspect = w / h;
      let drawW, drawH, drawX, drawY;

      if (cAspect > vAspect) {
        drawW = w;
        drawH = w / vAspect;
        drawX = 0;
        drawY = (h - drawH) / 2;
      } else {
        drawH = h;
        drawW = h * vAspect;
        drawX = (w - drawW) / 2;
        drawY = 0;
      }
      return { drawW, drawH, drawX, drawY };
    }

    // Maps normalized landmark coordinates (0..1) to screen pixel coordinates
    function mapLandmarkToScreen(pt, w, h, transform, mirrored) {
      const vx = transform.drawX + pt.x * transform.drawW;
      const vy = transform.drawY + pt.y * transform.drawH;
      const screenX = mirrored ? (w - vx) : vx;
      const screenY = vy;
      return { x: screenX, y: screenY };
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onHandResults);

    // Safe Frame Dispatcher to prevent concurrent processing and uninitialized frame errors
    async function sendFrameToHands() {
      if (!handsReady || isProcessingFrame || !videoElement || videoElement.readyState < 2 || !videoElement.videoWidth) {
        return;
      }
      isProcessingFrame = true;
      try {
        await hands.send({ image: videoElement });
      } catch (err) {
        console.warn("MediaPipe frame processing exception:", err);
      } finally {
        isProcessingFrame = false;
      }
    }

    function startCamera() {
      if (typeof Camera !== 'undefined') {
        const camera = new Camera(videoElement, {
          onFrame: async () => {
            await sendFrameToHands();
          },
          width: 1280,
          height: 720
        });
        camera.start().catch((err) => {
          console.warn("MediaPipe Camera initialization failed, starting fallback stream:", err);
          initFallbackCamera();
        });
      } else {
        initFallbackCamera();
      }
    }

    function initFallbackCamera() {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ 
          video: { 
            width: { ideal: 1280 }, 
            height: { ideal: 720 }, 
            facingMode: "user" 
          } 
        })
        .then(stream => {
          videoElement.srcObject = stream;
          videoElement.play();
          processFallbackLoop();
        })
        .catch(err => {
          console.error("Camera permissions error:", err);
        });
      }
    }

    async function processFallbackLoop() {
      await sendFrameToHands();
      requestAnimationFrame(processFallbackLoop);
    }

    function drawHandSkeletons(w, h, transform) {
      if (!handLandmarksList || handLandmarksList.length === 0) return;

      const connections = [
        [0, 1], [1, 2], [2, 3], [3, 4],
        [0, 5], [5, 6], [6, 7], [7, 8],
        [5, 9], [9, 10], [10, 11], [11, 12],
        [9, 13], [13, 14], [14, 15], [15, 16],
        [13, 17], [0, 17], [17, 18], [18, 19], [19, 20]
      ];

      overlayCtx.save();
      overlayCtx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      overlayCtx.lineWidth = 1.5;

      for (const hand of handLandmarksList) {
        for (const [i, j] of connections) {
          if (hand[i] && hand[j]) {
            const pt1 = mapLandmarkToScreen(hand[i], w, h, transform, isMirrored);
            const pt2 = mapLandmarkToScreen(hand[j], w, h, transform, isMirrored);
            overlayCtx.beginPath();
            overlayCtx.moveTo(pt1.x, pt1.y);
            overlayCtx.lineTo(pt2.x, pt2.y);
            overlayCtx.stroke();
          }
        }

        for (let i = 0; i < hand.length; i++) {
          const pt = mapLandmarkToScreen(hand[i], w, h, transform, isMirrored);
          const isFingertip = [4, 8, 12, 16, 20].includes(i);
          overlayCtx.fillStyle = isFingertip ? '#ffffff' : 'rgba(255, 255, 255, 0.6)';
          overlayCtx.beginPath();
          overlayCtx.arc(pt.x, pt.y, isFingertip ? 4 : 2, 0, Math.PI * 2);
          overlayCtx.fill();
        }
      }

      overlayCtx.restore();
    }

    function checkPinchGesture(w, h, transform) {
      if (!handLandmarksList || handLandmarksList.length === 0) {
        wasPinching = false;
        return;
      }

      let isPinchingAny = false;
      for (const hand of handLandmarksList) {
        const thumbTip = hand[4];
        const indexTip = hand[8];
        if (thumbTip && indexTip) {
          const dist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
          if (dist < 0.06) {
            isPinchingAny = true;
            break;
          }
        }
      }

      if (isPinchingAny && !wasPinching) {
        if (appMode === 'dimension') {
          cycleDimensionFilter();
        } else if (appMode === 'laser') {
          triggerPinchBadge("Laser Field Converged");
        } else if (appMode === 'blackhole') {
          triggerPinchBadge("Singularity Compressed");
        }
      }

      wasPinching = isPinchingAny;
    }

    function onHandResults(results) {
      updateFPS();

      const w = canvasOutput.width;
      const h = canvasOutput.height;
      const vW = videoElement.videoWidth || 1280;
      const vH = videoElement.videoHeight || 720;

      const transform = getCanvasTransform(w, h, vW, vH);

      handLandmarksList = results.multiHandLandmarks || [];
      const handCountEl = document.getElementById('hudHandCount');
      if (handCountEl) handCountEl.innerText = handLandmarksList.length;

      // 1. Draw Base Live Camera Feed with correct Cover Aspect Ratio
      ctxOutput.save();
      if (isMirrored) {
        ctxOutput.translate(w, 0);
        ctxOutput.scale(-1, 1);
      }
      ctxOutput.drawImage(videoElement, transform.drawX, transform.drawY, transform.drawW, transform.drawH);
      ctxOutput.restore();

      // 2. Clear Overlay Canvas
      overlayCtx.clearRect(0, 0, w, h);

      // Check Pinch Gestures
      checkPinchGesture(w, h, transform);

      // 3. Render Active App Mode
      if (appMode === 'laser') {
        renderLaserMode(w, h, transform);
      } else if (appMode === 'dimension') {
        renderDimensionBoxMode(w, h, transform);
      } else if (appMode === 'blackhole') {
        renderBlackHoleMode(w, h, transform);
      }
    }

    function renderLaserMode(w, h, transform) {
      const cyberHud = document.getElementById('cyberHud');
      if (cyberHud) cyberHud.classList.remove('hidden');
      const bhHud = document.getElementById('blackholeHud');
      if (bhHud) bhHud.classList.add('hidden');

      drawHandSkeletons(w, h, transform);

      if (handLandmarksList.length === 2) {
        const hand1 = handLandmarksList[0];
        const hand2 = handLandmarksList[1];

        const thumb1 = hand1[4]; const index1 = hand1[8];
        const thumb2 = hand2[4]; const index2 = hand2[8];

        const pinch1 = Math.hypot(thumb1.x - index1.x, thumb1.y - index1.y) < 0.06;
        const pinch2 = Math.hypot(thumb2.x - index2.x, thumb2.y - index2.y) < 0.06;
        const isPinching = pinch1 || pinch2;

        const handDist = Math.hypot(hand1[0].x - hand2[0].x, hand1[0].y - hand2[0].y);
        spreadVal = Math.min(100, Math.round(handDist * 180));
        
        const spreadEl = document.getElementById('hudSpread');
        if (spreadEl) spreadEl.innerText = `${spreadVal}%`;
        const paramLabel = document.getElementById('hudParamLabel');
        if (paramLabel) paramLabel.innerText = 'Laser Field:';
        const gestureEl = document.getElementById('hudGesture');
        if (gestureEl) gestureEl.innerText = isPinching ? 'PINCH !' : 'Open Hand';

        overlayCtx.save();
        overlayCtx.shadowBlur = isPinching ? 25 : 15;
        overlayCtx.shadowColor = '#ffffff';

        const numBeams = Math.min(hand1.length, hand2.length);

        for (let i = 0; i < numBeams; i++) {
          let pt1 = mapLandmarkToScreen(hand1[i], w, h, transform, isMirrored);
          let pt2 = mapLandmarkToScreen(hand2[i], w, h, transform, isMirrored);

          if (isPinching) {
            const midX = (pt1.x + pt2.x) / 2;
            const midY = (pt1.y + pt2.y) / 2;
            pt1.x = pt1.x * 0.3 + midX * 0.7;
            pt1.y = pt1.y * 0.3 + midY * 0.7;
            pt2.x = pt2.x * 0.3 + midX * 0.7;
            pt2.y = pt2.y * 0.3 + midY * 0.7;
          }

          overlayCtx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          overlayCtx.lineWidth = isPinching ? 3.5 : 2.0;

          overlayCtx.beginPath();
          overlayCtx.moveTo(pt1.x, pt1.y);
          overlayCtx.lineTo(pt2.x, pt2.y);
          overlayCtx.stroke();
        }

        overlayCtx.restore();

      } else if (handLandmarksList.length === 1) {
        const spreadEl = document.getElementById('hudSpread');
        if (spreadEl) spreadEl.innerText = '50%';
        const paramLabel = document.getElementById('hudParamLabel');
        if (paramLabel) paramLabel.innerText = 'Laser Field:';
        const gestureEl = document.getElementById('hudGesture');
        if (gestureEl) gestureEl.innerText = 'Single Hand';

        const hand = handLandmarksList[0];
        let wrist = mapLandmarkToScreen(hand[0], w, h, transform, isMirrored);

        overlayCtx.save();
        overlayCtx.shadowBlur = 12;
        overlayCtx.shadowColor = '#ffffff';
        overlayCtx.strokeStyle = '#ffffff';
        overlayCtx.lineWidth = 2;

        [4, 8, 12, 16, 20].forEach(tipIdx => {
          let tip = mapLandmarkToScreen(hand[tipIdx], w, h, transform, isMirrored);

          overlayCtx.beginPath();
          overlayCtx.moveTo(wrist.x, wrist.y);
          overlayCtx.lineTo(tip.x, tip.y);
          overlayCtx.stroke();
        });

        overlayCtx.restore();
      } else {
        const spreadEl = document.getElementById('hudSpread');
        if (spreadEl) spreadEl.innerText = '0%';
        const paramLabel = document.getElementById('hudParamLabel');
        if (paramLabel) paramLabel.innerText = 'Laser Field:';
        const gestureEl = document.getElementById('hudGesture');
        if (gestureEl) gestureEl.innerText = 'Searching...';
      }
    }

    function renderDimensionBoxMode(w, h, transform) {
      const cyberHud = document.getElementById('cyberHud');
      if (cyberHud) cyberHud.classList.remove('hidden');
      const bhHud = document.getElementById('blackholeHud');
      if (bhHud) bhHud.classList.add('hidden');

      drawHandSkeletons(w, h, transform);

      if (handLandmarksList.length >= 2) {
        const handL = handLandmarksList[0];
        const handR = handLandmarksList[1];

        let p1 = mapLandmarkToScreen(handL[8], w, h, transform, isMirrored);
        let p2 = mapLandmarkToScreen(handR[8], w, h, transform, isMirrored);
        let p3 = mapLandmarkToScreen(handR[4], w, h, transform, isMirrored);
        let p4 = mapLandmarkToScreen(handL[4], w, h, transform, isMirrored);

        // Render Filter Portal on Main Canvas inside clipped polygon
        ctxOutput.save();
        ctxOutput.beginPath();
        ctxOutput.moveTo(p1.x, p1.y);
        ctxOutput.lineTo(p2.x, p2.y);
        ctxOutput.lineTo(p3.x, p3.y);
        ctxOutput.lineTo(p4.x, p4.y);
        ctxOutput.closePath();
        ctxOutput.clip();

        if (dimensionFilter === 'pixel_grid') {
          ctxOutput.filter = 'contrast(180%) saturate(200%)';
          ctxOutput.drawImage(canvasOutput, 0, 0);
          ctxOutput.fillStyle = 'rgba(255, 255, 255, 0.12)';
          ctxOutput.fillRect(0, 0, w, h);
        } else if (dimensionFilter === 'cyan_edges') {
          ctxOutput.filter = 'invert(100%) contrast(200%)';
          ctxOutput.drawImage(canvasOutput, 0, 0);
        } else if (dimensionFilter === 'vhs_glitch') {
          ctxOutput.filter = 'contrast(150%) brightness(120%)';
          ctxOutput.drawImage(canvasOutput, -5, 0);
          ctxOutput.globalCompositeOperation = 'screen';
          ctxOutput.fillStyle = 'rgba(255, 255, 255, 0.15)';
          ctxOutput.fillRect(0, 0, w, h);
        } else if (dimensionFilter === 'pop_art') {
          ctxOutput.filter = 'saturate(500%) contrast(250%)';
          ctxOutput.drawImage(canvasOutput, 0, 0);
        } else if (dimensionFilter === 'neon_hologram') {
          ctxOutput.filter = 'invert(90%) grayscale(100%) contrast(200%)';
          ctxOutput.drawImage(canvasOutput, 0, 0);
        } else if (dimensionFilter === 'thermal') {
          ctxOutput.filter = 'invert(100%) sepia(100%) contrast(150%)';
          ctxOutput.drawImage(canvasOutput, 0, 0);
        } else if (dimensionFilter === 'negative') {
          ctxOutput.filter = 'invert(100%)';
          ctxOutput.drawImage(canvasOutput, 0, 0);
        }
        ctxOutput.restore();

        // Draw Wireframe Border & Corner Anchors
        overlayCtx.save();
        overlayCtx.strokeStyle = '#ffffff';
        overlayCtx.lineWidth = 2.5;
        overlayCtx.shadowBlur = 15;
        overlayCtx.shadowColor = '#ffffff';

        overlayCtx.beginPath();
        overlayCtx.moveTo(p1.x, p1.y);
        overlayCtx.lineTo(p2.x, p2.y);
        overlayCtx.lineTo(p3.x, p3.y);
        overlayCtx.lineTo(p4.x, p4.y);
        overlayCtx.closePath();
        overlayCtx.stroke();

        [p1, p2, p3, p4].forEach(pt => {
          overlayCtx.fillStyle = '#ffffff';
          overlayCtx.fillRect(pt.x - 6, pt.y - 6, 12, 12);
        });

        overlayCtx.restore();
      }
    }

    function renderBlackHoleMode(w, h, transform) {
      const cyberHud = document.getElementById('cyberHud');
      if (cyberHud) cyberHud.classList.remove('hidden');
      const bhHud = document.getElementById('blackholeHud');
      if (bhHud) bhHud.classList.remove('hidden');

      drawHandSkeletons(w, h, transform);

      // 1. Calculate Black Hole Singularity Position based on Hands
      if (handLandmarksList.length === 2) {
        const hand1 = handLandmarksList[0];
        const hand2 = handLandmarksList[1];
        const p1 = mapLandmarkToScreen(hand1[8], w, h, transform, isMirrored);
        const p2 = mapLandmarkToScreen(hand2[8], w, h, transform, isMirrored);
        
        targetBhX = (p1.x + p2.x) / 2;
        targetBhY = (p1.y + p2.y) / 2;

        const handDist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
        targetBhRadius = Math.max(35, Math.min(180, handDist * 0.45));

        const gestureEl = document.getElementById('hudGesture');
        if (gestureEl) gestureEl.innerText = 'Dual Hand Core';
      } else if (handLandmarksList.length === 1) {
        const hand = handLandmarksList[0];
        const indexTip = mapLandmarkToScreen(hand[8], w, h, transform, isMirrored);
        const thumbTip = mapLandmarkToScreen(hand[4], w, h, transform, isMirrored);

        targetBhX = indexTip.x;
        targetBhY = indexTip.y;

        const pinchDist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
        targetBhRadius = Math.max(25, Math.min(130, pinchDist * 1.8));

        const gestureEl = document.getElementById('hudGesture');
        if (gestureEl) gestureEl.innerText = 'Single Orbit';
      } else {
        // Idle floating motion
        targetBhX = w / 2 + Math.sin(performance.now() * 0.001) * 80;
        targetBhY = h / 2 + Math.cos(performance.now() * 0.0012) * 50;
        targetBhRadius = 75;

        const gestureEl = document.getElementById('hudGesture');
        if (gestureEl) gestureEl.innerText = 'Free Orbit';
      }

      // Smooth Physics Easing (Spring Interpolation)
      bhX += (targetBhX - bhX) * 0.12;
      bhY += (targetBhY - bhY) * 0.12;
      bhRadius += (targetBhRadius - bhRadius) * 0.12;
      bhSpinAngle += 0.035;

      // Update Telemetry Displays
      const bhMassEl = document.getElementById('bhMass');
      if (bhMassEl) bhMassEl.innerText = `${(bhRadius * 0.06).toFixed(2)} × 10⁶`;
      const bhRadiusEl = document.getElementById('bhRadius');
      if (bhRadiusEl) bhRadiusEl.innerText = `${Math.round(bhRadius)} px`;
      const bhDeflectEl = document.getElementById('bhDeflect');
      if (bhDeflectEl) bhDeflectEl.innerText = `${(bhRadius * 0.24).toFixed(1)}°`;

      const spreadEl = document.getElementById('hudSpread');
      if (spreadEl) spreadEl.innerText = `${Math.round((bhRadius / 180) * 100)}%`;
      const paramLabel = document.getElementById('hudParamLabel');
      if (paramLabel) paramLabel.innerText = 'Singularity Pull:';

      // 2. Gravitational Deflection / Optical Lensing Effect on Video Stream
      ctxOutput.save();
      const lensR = bhRadius * 2.4;
      ctxOutput.beginPath();
      ctxOutput.arc(bhX, bhY, lensR, 0, Math.PI * 2);
      ctxOutput.clip();

      // Mirror video clip distortion
      ctxOutput.translate(bhX, bhY);
      ctxOutput.scale(1.08, 1.08);
      ctxOutput.rotate(0.02);
      ctxOutput.translate(-bhX, -bhY);

      if (isMirrored) {
        ctxOutput.translate(w, 0);
        ctxOutput.scale(-1, 1);
      }
      ctxOutput.drawImage(videoElement, transform.drawX, transform.drawY, transform.drawW, transform.drawH);
      ctxOutput.restore();

      // 3. Render Black Hole Event Horizon, Accretion Disk, & Relativistic Halo
      overlayCtx.save();

      // Outer Gravitational Photon Sphere & Einstein Halo
      const photonGrad = overlayCtx.createRadialGradient(bhX, bhY, bhRadius * 0.6, bhX, bhY, bhRadius * 2.2);
      photonGrad.addColorStop(0, 'rgba(0, 0, 0, 1)');
      photonGrad.addColorStop(0.42, 'rgba(255, 255, 255, 0.95)');
      photonGrad.addColorStop(0.55, 'rgba(200, 200, 200, 0.6)');
      photonGrad.addColorStop(0.8, 'rgba(255, 255, 255, 0.15)');
      photonGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      overlayCtx.fillStyle = photonGrad;
      overlayCtx.beginPath();
      overlayCtx.arc(bhX, bhY, bhRadius * 2.2, 0, Math.PI * 2);
      overlayCtx.fill();

      // Swirling Accretion Disk Matter Particles
      overlayCtx.shadowBlur = 10;
      overlayCtx.shadowColor = '#ffffff';

      for (let p of bhParticles) {
        p.angle += p.speed * (150 / (p.distance + 20));
        p.distance -= 0.35;

        // Reset particles that fall past event horizon
        if (p.distance <= bhRadius * 0.8) {
          p.distance = bhRadius * 2.2 + Math.random() * 120;
          p.angle = Math.random() * Math.PI * 2;
        }

        let px, py;
        if (p.type === 'polar_jet') {
          // Relativistic Hawking polar radiation jet particles
          const jetDir = (p.angle > Math.PI) ? 1 : -1;
          px = bhX + (Math.random() - 0.5) * (bhRadius * 0.4);
          py = bhY + jetDir * (bhRadius * 0.8 + (p.distance - bhRadius * 0.8) * 1.4);
        } else {
          // Flattened tilted accretion disk orbit
          const tilt = 0.35;
          const rotatedAngle = p.angle + bhSpinAngle;
          px = bhX + Math.cos(rotatedAngle) * p.distance;
          py = bhY + Math.sin(rotatedAngle) * p.distance * tilt;
        }

        // Doppler beaming brightness (approaching particles are brighter)
        const doppler = 0.5 + 0.5 * Math.cos(p.angle + bhSpinAngle);
        overlayCtx.fillStyle = `rgba(255, 255, 255, ${p.alpha * doppler})`;
        overlayCtx.beginPath();
        overlayCtx.arc(px, py, p.size * (0.8 + doppler * 0.5), 0, Math.PI * 2);
        overlayCtx.fill();
      }

      // Event Horizon Boundary Shadow Singularity
      overlayCtx.shadowBlur = 30;
      overlayCtx.shadowColor = '#000000';
      overlayCtx.fillStyle = '#000000';
      overlayCtx.beginPath();
      overlayCtx.arc(bhX, bhY, bhRadius, 0, Math.PI * 2);
      overlayCtx.fill();

      // Sharp Inner Photon Ring Border
      overlayCtx.strokeStyle = '#ffffff';
      overlayCtx.lineWidth = 2.5;
      overlayCtx.beginPath();
      overlayCtx.arc(bhX, bhY, bhRadius, 0, Math.PI * 2);
      overlayCtx.stroke();

      overlayCtx.restore();
    }

    function triggerPinchBadge(msg) {
      const badge = document.getElementById('pinchBadge');
      const textEl = document.getElementById('pinchBadgeText');
      if (badge && textEl) {
        textEl.innerText = msg;
        badge.classList.remove('hidden');
        setTimeout(() => badge.classList.add('hidden'), 1800);
      }
    }

    function cycleDimensionFilter() {
      const filters = ['pixel_grid', 'cyan_edges', 'vhs_glitch', 'pop_art', 'neon_hologram', 'thermal', 'negative'];
      const nextIdx = (filters.indexOf(dimensionFilter) + 1) % filters.length;
      dimensionFilter = filters[nextIdx];
      const sel = document.getElementById('filterSelect');
      if (sel) sel.value = dimensionFilter;
      triggerPinchBadge("Filter: " + dimensionFilter.replace('_', ' ').toUpperCase());
    }

    function updateFPS() {
      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        const fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
        const fpsEl = document.getElementById('fpsCount');
        if (fpsEl) fpsEl.innerText = fps;
        frameCount = 0;
        lastFpsTime = now;
      }
    }

    function setAppMode(mode) {
      appMode = mode;
      const btnLaser = document.getElementById('btnModeLaser');
      if (btnLaser) btnLaser.classList.toggle('active', mode === 'laser');
      const btnDimension = document.getElementById('btnModeDimension');
      if (btnDimension) btnDimension.classList.toggle('active', mode === 'dimension');
      const btnBlackHole = document.getElementById('btnModeBlackHole');
      if (btnBlackHole) btnBlackHole.classList.toggle('active', mode === 'blackhole');

      const filterCtrl = document.getElementById('filterControl');
      if (filterCtrl) filterCtrl.classList.toggle('hidden', mode !== 'dimension');
    }

    function changeDimensionFilter(val) {
      dimensionFilter = val;
    }

    function toggleCameraMirror() {
      isMirrored = !isMirrored;
      const btnMirror = document.getElementById('btnMirror');
      if (btnMirror) btnMirror.classList.toggle('active', isMirrored);
    }

    function toggleReelMode() {
      reelMode = !reelMode;
      const topHUD = document.getElementById('topHUD');
      if (topHUD) topHUD.classList.toggle('opacity-0', reelMode);
      const bottomDock = document.getElementById('bottomDock');
      if (bottomDock) bottomDock.classList.toggle('opacity-0', reelMode);
    }

    window.onload = function() {
      startCamera();
    };
  </script>
